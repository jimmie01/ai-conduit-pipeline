name: Grok Usecases Video Launch

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Grok usecase slug (e.g. grok-chief-of-staff)"
        required: true
        default: "grok-chief-of-staff"
      title:
        description: "YouTube title (optional, auto-generated if empty)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk --no-install-recommends -qq
          pip install playwright edge-tts requests -q
          python3 -m playwright install chromium
          npm install -g hyperframes
          echo "OK deps"

      - name: Setup usecase info
        env:
          SLUG: ${{ github.event.inputs.slug }}
          INPUT_TITLE: ${{ github.event.inputs.title }}
        run: python3 scripts/setup_usecase_info.py

      - name: Generate HF templates
        env:
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          if [ -d "hf_original/${SLUG}" ]; then
            echo "HF template exists: hf_original/${SLUG}"
          else
            echo "Generating HF templates for ${SLUG}..."
            python3 scripts/gen_hf_inline.py "${SLUG}"
          fi

      - name: Render HF scenes
        env:
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          mkdir -p /tmp/clips
          HF_VIDEO_COVERAGE_THRESHOLD=0 hyperframes render "hf_original/${SLUG}" -o /tmp/hf_full.mp4 2>&1 | tail -5
          if [ -f "/tmp/hf_full.mp4" ]; then
            i=0
            for SCENE in hook problem solution demo cta; do
              START=$((i * 3))
              ffmpeg -i /tmp/hf_full.mp4 -ss $START -t 3 -r 30 \
                -c:v libx264 -crf 20 -preset fast -pix_fmt yuv420p \
                "/tmp/clips/hf_${SCENE}.mp4" -y 2>/dev/null
              i=$((i+1))
            done
            echo "HF render OK"
          else
            for SCENE in hook problem solution demo cta; do
              ffmpeg -f lavfi -i "color=c=0x0a0a0a:size=1080x1920:rate=30:duration=3" \
                -c:v libx264 -pix_fmt yuv420p "/tmp/clips/hf_${SCENE}.mp4" -y 2>/dev/null
            done
            echo "Fallback clips OK"
          fi
          ls -lh /tmp/clips/

      - name: Generate TTS
        continue-on-error: true
        timeout-minutes: 5
        env:
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          timeout 120 python3 scripts/gen_caption_composition.py "${SLUG}" || echo "TTS skipped"

      - name: Compose final video
        env:
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          mkdir -p /tmp/output
          printf "file '/tmp/clips/hf_hook.mp4'\nfile '/tmp/clips/hf_problem.mp4'\nfile '/tmp/clips/hf_solution.mp4'\nfile '/tmp/clips/hf_demo.mp4'\nfile '/tmp/clips/hf_cta.mp4'\n" > /tmp/clip_list.txt
          ffmpeg -f concat -safe 0 -i /tmp/clip_list.txt \
            -c:v libx264 -preset fast -crf 20 -pix_fmt yuv420p \
            /tmp/video_no_audio.mp4 -y 2>/dev/null
          AUDIO_FILE=""
          for f in "/tmp/${SLUG}.mp3" "/tmp/tts.mp3"; do
            [ -f "$f" ] && AUDIO_FILE="$f" && break
          done
          if [ -n "$AUDIO_FILE" ]; then
            ffmpeg -i /tmp/video_no_audio.mp4 -i "$AUDIO_FILE" \
              -map 0:v -map 1:a -c:v copy -c:a aac -b:a 128k -shortest \
              "/tmp/output/${SLUG}_final.mp4" -y 2>/dev/null
            echo "Video with audio OK"
          else
            cp /tmp/video_no_audio.mp4 "/tmp/output/${SLUG}_final.mp4"
            echo "Video without audio OK"
          fi
          ls -lh /tmp/output/

      - name: Upload to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          VIDEO_FILE="/tmp/output/${SLUG}_final.mp4"
          if [ ! -f "$VIDEO_FILE" ]; then
            echo "ERROR: Video not found"
            exit 1
          fi
          cp "$VIDEO_FILE" output.mp4
          echo "output.mp4: $(ls -lh output.mp4 | awk '{print $5}')"
          python3 scripts/youtube_upload_direct.py "${SLUG}"

      - name: Summary
        if: always()
        env:
          SLUG: ${{ github.event.inputs.slug }}
        run: |
          echo "## Grok Usecase Video: ${SLUG}" >> $GITHUB_STEP_SUMMARY
          [ -f "/tmp/output/${SLUG}_final.mp4" ] && echo "- Video: generated" >> $GITHUB_STEP_SUMMARY
          TITLE=$(cat /tmp/video_title.txt 2>/dev/null || echo "")
          [ -n "$TITLE" ] && echo "- Title: $TITLE" >> $GITHUB_STEP_SUMMARY
