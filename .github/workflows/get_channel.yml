name: Get Channel URL
on:
  workflow_dispatch:
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client google-auth requests
      - name: Get channel info
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 -c "
import os, requests
r = requests.post('https://oauth2.googleapis.com/token', data={
    'grant_type': 'refresh_token',
    'refresh_token': os.environ['YOUTUBE_REFRESH_TOKEN'],
    'client_id': os.environ['YOUTUBE_CLIENT_ID'],
    'client_secret': os.environ['YOUTUBE_CLIENT_SECRET'],
}, timeout=10)
print('TOKEN_STATUS:', r.status_code)
token = r.json().get('access_token','')
if token:
    r2 = requests.get('https://www.googleapis.com/youtube/v3/channels?part=snippet&mine=true',
        headers={'Authorization': f'Bearer {token}'}, timeout=10)
    items = r2.json().get('items',[])
    if items:
        s = items[0]['snippet']
        print('CHANNEL_ID:', items[0]['id'])
        print('TITLE:', s['title'])
        print('CUSTOM_URL:', s.get('customUrl',''))
    else:
        print('NO_ITEMS', r2.json())
else:
    print('TOKEN_ERROR', r.json())
"
