name: Codex Launch Video Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk --no-install-recommends -qq
          pip install playwright edge-tts -q
          python3 -m playwright install chromium
          npm install -g hyperframes
          echo "✅ 完了"

      - name: Step1 - Render HF scenes
        run: |
          mkdir -p /tmp/clips
          # hook（5秒）
          HF_VIDEO_COVERAGE_THRESHOLD=0 hyperframes render hf_original/codex-launch -o /tmp/hf_full.mp4 2>/dev/null
          ffmpeg -i /tmp/hf_full.mp4 -t 5 -r 30 -c:v libx264 -crf 20 -preset fast -pix_fmt yuv420p /tmp/clips/hf_hook.mp4 -y 2>/dev/null && echo "✅ HF hook 5秒"
          # present（5秒）: 5秒目から
          ffmpeg -i /tmp/hf_full.mp4 -ss 5 -t 5 -r 30 -c:v libx264 -crf 20 -preset fast -pix_fmt yuv420p /tmp/clips/hf_present.mp4 -y 2>/dev/null && echo "✅ HF present 5秒"
          # ending（5秒）: 10秒目から
          ffmpeg -i /tmp/hf_full.mp4 -ss 10 -t 5 -r 30 -c:v libx264 -crf 20 -preset fast -pix_fmt yuv420p /tmp/clips/hf_ending.mp4 -y 2>/dev/null && echo "✅ HF ending 5秒"
          mkdir -p /tmp/clips
          ls -lh /tmp/clips/

      - name: Step2 - Record screen scenes
        run: |
          python3 << 'RECEOF'
          import asyncio, os, subprocess
          from playwright.async_api import async_playwright

          scenes = [
              {"url": "https://techcrunch.com/category/artificial-intelligence/", "duration": 7, "scroll_from": 0, "scroll_to": 400, "id": "techcrunch"},
              {"url": "https://www.theverge.com/ai-artificial-intelligence", "duration": 7, "scroll_from": 0, "scroll_to": 600, "id": "verge"},
              {"url": "https://github.com/openai/codex", "duration": 8, "scroll_from": 0, "scroll_to": 0, "id": "codex_top"},
              {"url": "https://github.com/openai/codex", "duration": 7, "scroll_from": 0, "scroll_to": 800, "id": "codex_readme"},
          ]

          async def record(scene):
              out_dir = f"/tmp/scenes/{scene['id']}"
              os.makedirs(out_dir, exist_ok=True)
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=["--no-sandbox"])
                  page = await browser.new_page(
                      viewport={"width": 540, "height": 960},
                      user_agent="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X)")
                  for attempt in range(3):
                      try:
                          await page.goto(scene["url"], wait_until="domcontentloaded", timeout=60000)
                          break
                      except:
                          await asyncio.sleep(3)
                  await page.wait_for_timeout(2000)
                  fps, frames = 30, scene["duration"] * 30
                  for i in range(frames):
                      scroll = int(scene["scroll_from"] + (scene["scroll_to"] - scene["scroll_from"]) * i / frames) if scene["scroll_to"] > scene["scroll_from"] else scene["scroll_from"]
                      await page.evaluate(f"window.scrollTo(0, {scroll})")
                      await page.screenshot(path=f"{out_dir}/frame_{i:04d}.png")
                      await page.wait_for_timeout(33)
                  await browser.close()
              subprocess.run(["ffmpeg", "-r", "30", "-i", f"{out_dir}/frame_%04d.png",
                  "-vf", "scale=1080:1920:flags=lanczos",
                  "-c:v", "libx264", "-crf", "18", "-pix_fmt", "yuv420p",
                  f"/tmp/clips/{scene['id']}.mp4", "-y"], capture_output=True)
              print(f"✅ {scene['id']} 録画完了")

          async def main():
              for s in scenes:
                  await record(s)
          asyncio.run(main())
          RECEOF

      - name: Step3 - Prepare Broll footage
        run: |
          # ai_automation (縦型・5秒・30fps統一)
          ffmpeg -i assets/stock/ai_automation.mp4 -t 5 -r 30 \
            -vf "vignette=PI/4" \
            -c:v libx264 -crf 20 -preset fast -pix_fmt yuv420p \
            /tmp/clips/broll_ai.mp4 -y 2>/dev/null && echo "✅ Bロール1 ai_automation 5秒"

          # freelance_laptop (1080x2048→1080x1920crop・5秒・30fps統一)
          ffmpeg -i assets/stock/freelance_laptop.mp4 -t 5 -r 30 \
            -vf "crop=1080:1920:0:64,vignette=PI/4" \
            -c:v libx264 -crf 20 -preset fast -pix_fmt yuv420p \
            /tmp/clips/broll_laptop.mp4 -y 2>/dev/null && echo "✅ Bロール2 freelance_laptop 5秒"

          echo "=== 全クリップ確認 ==="
          for f in /tmp/clips/*.mp4; do
            dur=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 $f 2>/dev/null)
            wh=$(ffprobe -v quiet -show_entries stream=width,height -of csv=p=0 $f 2>/dev/null | head -1)
            echo "  $(basename $f): ${dur}秒 ${wh}"
          done

      - name: Step4 - Apply effects to screen recordings
        run: |
          FONT=/usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc

          # Scene2 TechCrunch: VIGNETTE（zoompan削除・長さ固定）
          ffmpeg -i /tmp/clips/techcrunch.mp4 -t 7 -r 30 \
            -vf "vignette=PI/4" \
            -c:v libx264 -crf 20 -preset fast -pix_fmt yuv420p \
            /tmp/clips/fx_techcrunch.mp4 -y 2>/dev/null && echo "✅ TechCrunch VIGNETTE"

          # Scene4 The Verge: VIGNETTE
          ffmpeg -i /tmp/clips/verge.mp4 -r 30 \
            -vf "vignette=PI/4" \
            -c:v libx264 -crf 20 -preset fast -pix_fmt yuv420p \
            /tmp/clips/fx_verge.mp4 -y 2>/dev/null && echo "✅ The Verge VIGNETTE"

          # Scene5 Bロール2: CINEMATIC COLOR（暖色補正）
          ffmpeg -i /tmp/clips/broll_laptop.mp4 -r 30 \
            -vf "colorbalance=rs=0.1:gs=0.05:bs=-0.1:rm=0.1:gm=0.05:bm=-0.1,vignette=PI/4" \
            -c:v libx264 -crf 20 -preset fast -pix_fmt yuv420p \
            /tmp/clips/fx_broll_laptop.mp4 -y 2>/dev/null && echo "✅ Bロール2 CINEMATIC COLOR"

          # Scene7 GitHub Codex Top: HIGHLIGHT BOX + VIGNETTE
          ffmpeg -i /tmp/clips/codex_top.mp4 -r 30 \
            -vf "drawbox=x=20:y=80:w=1040:h=750:color=yellow@0.3:t=5,vignette=PI/4" \
            -c:v libx264 -crf 20 -preset fast -pix_fmt yuv420p \
            /tmp/clips/fx_codex_top.mp4 -y 2>/dev/null && echo "✅ GitHub Top HIGHLIGHT+VIGNETTE"

          # Scene8 GitHub README: HIGHLIGHT BOX（zoompan削除・長さ固定）
          ffmpeg -i /tmp/clips/codex_readme.mp4 -t 7 -r 30 \
            -vf "drawbox=x=20:y=80:w=1040:h=750:color=yellow@0.3:t=5,vignette=PI/4" \
            -c:v libx264 -crf 20 -preset fast -pix_fmt yuv420p \
            /tmp/clips/fx_codex_readme.mp4 -y 2>/dev/null && echo "✅ GitHub README HIGHLIGHT+VIGNETTE"

          echo "=== エフェクト適用済みクリップ確認 ==="
          for f in /tmp/clips/fx_*.mp4; do
            dur=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 $f 2>/dev/null)
            echo "  $(basename $f): ${dur}秒"
          done

      - name: Step5 - Concat with xfade transitions
        run: |
          mkdir -p /tmp/final
          python3 << 'XFEOF'
          import subprocess, os, sys

          def dur(f):
              r = subprocess.run(["ffprobe","-v","quiet","-show_entries","format=duration","-of","csv=p=0",f],
                  capture_output=True, text=True)
              try:
                  return float(r.stdout.strip())
              except:
                  return 0.0

          def xfade(in1, in2, out, transition, offset):
              cmd = ["ffmpeg","-i",in1,"-i",in2,
                  "-filter_complex",f"[0:v][1:v]xfade=transition={transition}:duration=0.4:offset={offset:.2f}[v]",
                  "-map","[v]","-c:v","libx264","-crf","20","-preset","fast","-pix_fmt","yuv420p",
                  out,"-y"]
              r = subprocess.run(cmd, capture_output=True)
              size = os.path.getsize(out) if os.path.exists(out) else 0
              label = os.path.basename(out)
              if r.returncode == 0 and size > 1000:
                  print(f"✅ {label} ({size//1024}KB) offset={offset:.2f}")
                  return True
              else:
                  print(f"❌ {label} 失敗 (size={size}, offset={offset:.2f})")
                  print(r.stderr.decode()[-200:] if r.stderr else "")
                  return False

          clips = {
              "hf_hook":      "/tmp/clips/hf_hook.mp4",
              "techcrunch":   "/tmp/clips/fx_techcrunch.mp4",
              "broll_ai":     "/tmp/clips/broll_ai.mp4",
              "verge":        "/tmp/clips/fx_verge.mp4",
              "broll_laptop": "/tmp/clips/fx_broll_laptop.mp4",
              "hf_present":   "/tmp/clips/hf_present.mp4",
              "codex_top":    "/tmp/clips/fx_codex_top.mp4",
              "codex_readme": "/tmp/clips/fx_codex_readme.mp4",
              "hf_ending":    "/tmp/clips/hf_ending.mp4",
          }

          # 各クリップの長さを確認
          for name, path in clips.items():
              d = dur(path)
              print(f"  {name}: {d:.2f}秒")

          # xfade連結
          current = clips["hf_hook"]
          steps = [
              (clips["techcrunch"],   "/tmp/final/t1.mp4", "hlslice"),
              (clips["broll_ai"],     "/tmp/final/t2.mp4", "wipeleft"),
              (clips["verge"],        "/tmp/final/t3.mp4", "slideleft"),
              (clips["broll_laptop"], "/tmp/final/t4.mp4", "slideup"),
              (clips["hf_present"],   "/tmp/final/t5.mp4", "diagtl"),
              (clips["codex_top"],    "/tmp/final/t6.mp4", "circleopen"),
              (clips["codex_readme"], "/tmp/final/t7.mp4", "slideright"),
              (clips["hf_ending"],    "/tmp/final/t8.mp4", "wiperight"),
          ]

          for next_clip, out, transition in steps:
              d = dur(current)
              offset = max(0.1, d - 0.4)
              print(f"  current={os.path.basename(current)} dur={d:.2f}秒 offset={offset:.2f}")
              ok = xfade(current, next_clip, out, transition, offset)
              if not ok:
                  sys.exit(1)
              current = out

          # FADE OUT
          d = dur(current)
          fade_st = max(0.1, d - 1.5)
          cmd = ["ffmpeg","-i",current,
              "-vf",f"fade=t=out:st={fade_st:.2f}:d=1.5",
              "-c:v","libx264","-crf","20","-preset","fast","-pix_fmt","yuv420p",
              "/tmp/final/video_no_audio.mp4","-y"]
          r = subprocess.run(cmd, capture_output=True)
          if r.returncode == 0:
              d2 = dur("/tmp/final/video_no_audio.mp4")
              size = os.path.getsize("/tmp/final/video_no_audio.mp4")
              print(f"✅ FADE OUT完了 動画長: {d2:.2f}秒 ({size//1024}KB)")
          else:
              print("❌ FADE OUT失敗")
              sys.exit(1)
          XFEOF

      - name: Step6 - Generate TTS + SRT + ASS
        run: |
          pip install edge-tts -q
          python3 scripts/gen_caption_composition.py "codex-launch" narration.mp3 captions.html narration.srt
          echo "✅ TTS+SRT生成完了"
          python3 scripts/gen_subtitle_filter.py narration.srt narration.ass
          echo "✅ ASS字幕生成完了"
          cat narration.srt

      - name: Step7 - Merge narration + ASS subtitles
        run: |
          # 既存パイプラインと同じ方式
          if ffmpeg -filters 2>&1 | grep -q "^.*ass"; then
            ffmpeg -y \
              -i /tmp/final/video_no_audio.mp4 \
              -i narration.mp3 \
              -vf "ass=narration.ass" \
              -map 0:v -map 1:a \
              -c:v libx264 -c:a aac -pix_fmt yuv420p \
              /tmp/final/output.mp4 2>/dev/null && echo "✅ ASS字幕+ナレーション合成完了"
          else
            ffmpeg -y \
              -i /tmp/final/video_no_audio.mp4 \
              -i narration.mp3 \
              -map 0:v -map 1:a \
              -c:v libx264 -c:a aac -pix_fmt yuv420p \
              /tmp/final/output.mp4 2>/dev/null && echo "✅ ナレーション合成完了（字幕なし）"
          fi

      - name: Step8 - BGM mix (Before the Gates)
        run: |
          VIDEO_DUR=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 /tmp/final/output.mp4)
          FADE_START=$(echo "$VIDEO_DUR - 3" | bc)
          echo "動画長: ${VIDEO_DUR}秒 フェードアウト: ${FADE_START}秒"
          ffmpeg -y -i assets/bgm/before_the_gates.mp3 -i assets/bgm/before_the_gates.mp3 -i /tmp/final/output.mp4 -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1,afade=t=in:st=0:d=2,afade=t=out:st=${FADE_START}:d=3,volume=0.18[bgm];[2:a][bgm]amix=inputs=2:duration=longest,atrim=0:${VIDEO_DUR}[aout]" -map 2:v -map "[aout]" -c:v copy -c:a aac -b:a 192k -ar 44100 -ac 2 -t $VIDEO_DUR /tmp/final/codex_launch_final.mp4 2>/dev/null && echo "✅ BGMミックス完了" || echo "❌ BGMミックス失敗"
          ls -lh /tmp/final/codex_launch_final.mp4
          ffprobe -v quiet -show_entries format=duration -of csv=p=0 /tmp/final/codex_launch_final.mp4
          ffprobe -v quiet -show_entries stream=codec_name,sample_rate,channels -of csv=p=0 /tmp/final/codex_launch_final.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: codex-launch-final
          path: /tmp/final/codex_launch_final.mp4
          retention-days: 3

      - name: Upload to YouTube
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          SAMPLE_NAME: codex-launch
        run: |
          cp /tmp/final/codex_launch_final.mp4 output.mp4
          pip install requests --quiet
          python3 scripts/youtube_upload.py && echo "done" || echo "failed"

