name: Answer HTML Launch Video
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          sudo apt-get install -y ffmpeg fonts-noto-cjk --no-install-recommends -qq
          pip install edge-tts -q
          npm install -g hyperframes
          echo "✅ 完了"

      - name: Step1 - Generate HF HTMLs from plan
        run: |
          mkdir -p /tmp/hf_launch/compositions
          python3 << 'PYEOF2'
import json, os

scenes = [{"id": "hook", "seconds": 3, "camera": "クローズアップ", "text_main": "HTMLで答えられない質問、ありませんか？", "text_sub": "", "visual": "frustrated programmer desk", "animation": "フェードイン", "effect": "ビネット"}, {"id": "agitate", "seconds": 4, "camera": "スローズームイン", "text_main": "複雑な質問に何時間も検索…", "text_sub": "情報が散らばって時間が無駄に", "visual": "messy desk with papers and laptop", "animation": "スライドアップ", "effect": "グリッチ"}, {"id": "present", "seconds": 6, "camera": "ダイナミックパーン", "text_main": "AIがHTML1枚で即答！", "text_sub": "『answer-me-with-html』で30秒解決", "visual": "code editor AI generating HTML", "animation": "ズームイン", "effect": "グロー"}, {"id": "demo", "seconds": 5, "camera": "オーバーザショルダー", "text_main": "実際にコードが生成される様子", "text_sub": "質問入力→HTMLが完成", "visual": "screen capture of AI tool generating HTML", "animation": "フェードイン→スライド左", "effect": "なし"}, {"id": "cta", "seconds": 2, "camera": "固定ショット", "text_main": "今すぐ試す！", "text_sub": "コメントで質問をシェア", "visual": "hand tapping phone screen", "animation": "ポップイン", "effect": "ビネット"}]
palette = {"primary": "#1E90FF", "accent": "#FF6F61", "bg": "#F5F5F5"}
primary = palette["primary"]
accent = palette["accent"]
bg = "#0a0a0f"

def make_scene(scene):
    sid = scene["id"]
    text_main = scene["text_main"].replace('"', '&quot;')
    text_sub = scene.get("text_sub","").replace('"', '&quot;')
    seconds = scene["seconds"]
    effect = scene.get("effect","")
    effect_css = "box-shadow:inset 0 0 120px rgba(0,0,0,0.8);" if "ビネット" in effect else ""
    return f"""<template>
<div id="{sid}" data-composition-id="{sid}" data-start="0" data-duration="{seconds}"
     data-width="1080" data-height="1920"
     style="position:relative;width:1080px;height:1920px;overflow:hidden;background:{bg};">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=block');
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.9) 100%);pointer-events:none;{effect_css}}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:80px 80px;}
.content{position:absolute;top:50%;left:0;right:0;padding:0 80px;transform:translateY(-50%);text-align:center;opacity:0;}
.text-main{font-size:80px;font-weight:900;line-height:1.2;margin-bottom:32px;background:linear-gradient(180deg,#fff 0%,{primary} 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.text-sub{font-size:40px;color:rgba(255,255,255,0.65);line-height:1.6;}
.bar{height:4px;background:linear-gradient(to right,{primary},{accent});border-radius:2px;margin:0 auto 40px;width:0;}
</style>
<div class="grid"></div><div class="vignette"></div>
<div class="content" id="{sid}-c">
  <div class="bar" id="{sid}-bar"></div>
  <div class="text-main">{text_main}</div>
  {'<div class="text-sub">'+text_sub+'</div>' if text_sub else ''}
</div>
<script>
(function(){
  const tl=gsap.timeline({defaults:{ease:"power3.out"}});
  tl.to("#{sid}-bar",{width:240,duration:0.5},0.1)
    .to("#{sid}-c",{opacity:1,y:0,duration:0.7},0.3);
  if(window.__timelines) window.__timelines["{sid}"]=tl;
})();
</script>
</div>
</template>""".format(sid=sid,seconds=seconds,bg=bg,effect_css=effect_css,
    primary=primary,accent=accent,text_main=text_main,text_sub=text_sub)

total = sum(s["seconds"] for s in scenes)
offset = 0
clips = []
for i,s in enumerate(scenes):
    clips.append(f'<div class="clip" data-composition-id="{s["id"]}" data-composition-src="compositions/{s["id"]}.html" data-start="{offset}" data-duration="{s["seconds"]}" data-track-index="{i+1}"></div>')
    offset += s["seconds"]

index_html = f"""<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;}html,body{width:1080px;height:1920px;overflow:hidden;background:#000;}#root{position:relative;width:1080px;height:1920px;}.clip{position:absolute;inset:0;}</style>
<script>window.__timelines={};</script>
</head><body>
<div id="root" data-composition-id="answer-html-hook" data-start="0" data-width="1080" data-height="1920" data-duration="{total}">
  {" ".join(clips)}
</div></body></html>"""

os.makedirs("/tmp/hf_launch/compositions", exist_ok=True)
open("/tmp/hf_launch/index.html","w").write(index_html)
for s in scenes:
    open(f"/tmp/hf_launch/compositions/{s[\'id\']}.html","w").write(make_scene(s))
print(f"✅ HF HTML生成完了 ({total}秒)")
PYEOF2

      - name: Step2 - Render HF
        run: |
          HF_VIDEO_COVERAGE_THRESHOLD=0 hyperframes render /tmp/hf_launch -o /tmp/hf_out.mp4
          ffprobe -v quiet -show_entries format=duration -of csv=p=0 /tmp/hf_out.mp4
          echo "✅ HFレンダリング完了"

      - name: Step3 - Broll footage
        run: |
          mkdir -p /tmp/clips
          python3 << 'BEOF'
import urllib.request, json, os
headers = {"Authorization": "${{ secrets.PEXELS_API_KEY }}"}
queries = ["frustrated programmer desk", "messy desk with papers and laptop", "code editor AI generating HTML", "screen capture of AI tool generating HTML", "hand tapping phone screen"]
for i, q in enumerate(queries):
    try:
        req = urllib.request.Request(
            f"https://api.pexels.com/videos/search?query={q}&orientation=portrait&per_page=1",
            headers=headers)
        data = json.load(urllib.request.urlopen(req))
        if data.get("videos"):
            url = data["videos"][0]["video_files"][0]["link"]
            urllib.request.urlretrieve(url, f"/tmp/clips/broll_{i}.mp4")
            print(f"✅ Broll{i}: {q}")
    except Exception as e:
        print(f"⚠️ Broll{i}失敗: {e}")
BEOF

      - name: Step4 - TTS generation
        run: |
          python3 -c "
import asyncio, edge_tts
async def main():
    tts = edge_tts.Communicate(\"HTMLで答えられない質問、ずっと悩んでいませんか？検索に時間をかけても結局見つからない…そんなときは『answer-me-with-html』が救世主です。AIがあなたの質問を解析し、たった30秒で完璧なHTMLページを生成。画面にコードが瞬時に現れる様子をご覧ください。さあ、今すぐ試してみましょう！コメントであなたの質問をシェアしてください。\", \"ja-JP-NanamiNeural\")
    await tts.save(\"/tmp/narration.mp3\")
asyncio.run(main())
"
          echo "✅ TTS生成完了"

      - name: Step5 - Final mix
        run: |
          VIDEO_DUR=$(ffprobe -v quiet -show_entries format=duration -of csv=p=0 /tmp/hf_out.mp4)
          ffmpeg -y -i /tmp/hf_out.mp4 -i /tmp/narration.mp3 \
            -map 0:v -map 1:a \
            -c:v copy -c:a aac -b:a 192k \
            -shortest /tmp/final_output.mp4 2>/dev/null && echo "✅ ミックス完了"

      - name: Upload to YouTube
        run: |
          python3 scripts/youtube_upload.py \
            --file /tmp/final_output.mp4 \
            --title "AIがHTML1枚で難問解決！『answer-me-with-html』" \
            --description "AIがHTML1枚で難しい質問に答えるエージェントスキル。\n\nGitHub: https://github.com/simonw/answer-me-with-html\n\n#AI #GitHub #開発" \
            --tags "AI,GitHub,HTML,エージェント,開発ツール" \
            --category 28

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: answer-html-launch
          path: /tmp/final_output.mp4
          retention-days: 1
