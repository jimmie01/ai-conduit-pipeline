<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;}
.clip{position:absolute;inset:0;will-change:transform,opacity;}
</style>
<script>window.__timelines = {};</script>
</head>
<body>
<div id="root" data-composition-id="codex-launch-hook"
     data-start="0" data-width="1080" data-height="1920" data-duration="15">
  <div class="clip" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="5" data-track-index="1"></div>
  <div class="clip" data-composition-id="present" data-composition-src="compositions/present.html" data-start="5" data-duration="5" data-track-index="2"></div>
  <div class="clip" data-composition-id="ending" data-composition-src="compositions/ending.html" data-start="10" data-duration="5" data-track-index="3"></div>
</div>
</body>
</html>
